; Client export presets. No signing secrets live here: code signing and
; notarization settings are added locally (or in CI) and must not be committed.
; Server content (nakama/), tools, tests, docs and dev/test levels never ship;
; tools/check_build.sh exports a pack and fails if any of them leaks in.

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="content/offline_mysteries.json, content/castle/kit.json, levels/grounds/*.json, levels/grounds/*.bin"
exclude_filter="nakama/*, tools/*, tests/*, docs/*, levels/dev/*, levels/mvp/*, content/placements.json"
export_path="export/windows/WizardsOnline.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

binary_format/embed_pck=false
binary_format/architecture="x86_64"

[preset.1]

name="macOS"
platform="macOS"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="content/offline_mysteries.json, content/castle/kit.json, levels/grounds/*.json, levels/grounds/*.bin"
exclude_filter="nakama/*, tools/*, tests/*, docs/*, levels/dev/*, levels/mvp/*, content/placements.json"
export_path="export/macos/WizardsOnline.zip"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

binary_format/architecture="universal"
application/bundle_identifier="online.wizards.client"
application/short_version="0.1"
application/version="0.1"
codesign/codesign=1
