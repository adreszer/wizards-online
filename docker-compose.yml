# Local development backend: Nakama + PostgreSQL.
# Usage: docker compose up -d   (then run the Godot project and choose ONLINE)
# Credentials below are for local development only.
services:
  postgres:
    image: postgres:16-alpine
    container_name: wizards-postgres
    environment:
      POSTGRES_DB: nakama
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localdb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nakama"]
      interval: 3s
      timeout: 3s
      retries: 20
    expose:
      - "5432"

  nakama:
    image: registry.heroiclabs.com/heroiclabs/nakama:3.28.0
    container_name: wizards-nakama
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        /nakama/nakama migrate up --database.address postgres:localdb@postgres:5432/nakama &&
        exec /nakama/nakama --config /nakama/data/local.yml --database.address postgres:localdb@postgres:5432/nakama
    volumes:
      - ./nakama:/nakama/data
    ports:
      - "7349:7349"   # gRPC
      - "7350:7350"   # HTTP + WebSocket (game clients)
      - "7351:7351"   # Console (http://localhost:7351, admin / password)
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
