# Hosted backend for Coolify (Docker Compose build pack). Nothing is published on
# the host: Coolify's proxy terminates TLS on the domain set for `nakama` (port
# 7350, HTTP + WebSocket). Secrets are environment variables set in Coolify; the
# SERVICE_PASSWORD_* ones are generated by Coolify. See docs/deploy.md.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nakama
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nakama"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  nakama:
    build:
      context: .
      dockerfile: deploy/nakama/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      NAKAMA_SERVER_KEY: ${NAKAMA_SERVER_KEY}
      NAKAMA_HTTP_KEY: ${SERVICE_PASSWORD_64_HTTPKEY}
      NAKAMA_SESSION_KEY: ${SERVICE_PASSWORD_64_SESSION}
      NAKAMA_REFRESH_KEY: ${SERVICE_PASSWORD_64_REFRESH}
      NAKAMA_CONSOLE_PASSWORD: ${SERVICE_PASSWORD_CONSOLE}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
    expose:
      - "7350"   # game clients (route the public domain here)
      - "7351"   # admin console (optional second domain)
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
